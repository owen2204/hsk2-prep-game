<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Vocabulary Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-10">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🐉</span>
                <h1 class="text-xl font-bold bg-gradient-to-r from-red-400 to-amber-400 bg-clip-text text-transparent">
                    HSK Vocabulary Dashboard
                </h1>
            </div>
            <button onclick="switchTab('quiz')" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg font-medium transition shadow-lg shadow-red-900/40">
                🎯 เริ่มทำควิซ
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-8 space-y-8">

        <!-- Stat Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass p-5 rounded-2xl border border-slate-800 flex justify-between items-center">
                <div>
                    <p class="text-slate-400 text-sm">คำศัพท์ทั้งหมด</p>
                    <h3 id="stat-total" class="text-3xl font-bold text-white mt-1">0</h3>
                </div>
                <span class="text-2xl p-3 bg-slate-800 rounded-xl">📚</span>
            </div>
            <div class="glass p-5 rounded-2xl border border-slate-800 flex justify-between items-center">
                <div>
                    <p class="text-slate-400 text-sm">HSK ระดับ 1</p>
                    <h3 id="stat-hsk1" class="text-3xl font-bold text-emerald-400 mt-1">0</h3>
                </div>
                <span class="text-2xl p-3 bg-emerald-950/50 rounded-xl">🟢</span>
            </div>
            <div class="glass p-5 rounded-2xl border border-slate-800 flex justify-between items-center">
                <div>
                    <p class="text-slate-400 text-sm">HSK ระดับ 2</p>
                    <h3 id="stat-hsk2" class="text-3xl font-bold text-sky-400 mt-1">0</h3>
                </div>
                <span class="text-2xl p-3 bg-sky-950/50 rounded-xl">🔵</span>
            </div>
            <div class="glass p-5 rounded-2xl border border-slate-800 flex justify-between items-center">
                <div>
                    <p class="text-slate-400 text-sm">HSK ระดับ 3</p>
                    <h3 id="stat-hsk3" class="text-3xl font-bold text-purple-400 mt-1">0</h3>
                </div>
                <span class="text-2xl p-3 bg-purple-950/50 rounded-xl">🟣</span>
            </div>
        </div>

        <!-- Tab: Vocabulary List -->
        <section id="tab-vocab" class="space-y-4">
            <!-- Filter & Search Bar -->
            <div class="glass p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row gap-4 justify-between">
                <input type="text" id="search-input" oninput="renderVocabTable()" placeholder="🔍 ค้นหาคำศัพท์ พินอิน หรือคำแปล..." 
                    class="bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 w-full sm:w-80 focus:outline-none focus:border-red-500 text-sm">
                
                <div class="flex gap-2 overflow-x-auto">
                    <button onclick="filterLevel('all')" id="btn-lvl-all" class="px-4 py-2 rounded-xl text-sm font-medium bg-red-600 text-white">ทั้งหมด</button>
                    <button onclick="filterLevel(1)" id="btn-lvl-1" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300">HSK 1</button>
                    <button onclick="filterLevel(2)" id="btn-lvl-2" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300">HSK 2</button>
                    <button onclick="filterLevel(3)" id="btn-lvl-3" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300">HSK 3</button>
                </div>
            </div>

            <!-- Table -->
            <div class="glass rounded-2xl border border-slate-800 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-900/90 text-slate-400 uppercase text-xs border-b border-slate-800">
                            <tr>
                                <th class="p-4">HSK</th>
                                <th class="p-4">คำศัพท์</th>
                                <th class="p-4">พินอิน</th>
                                <th class="p-4">ประเภท</th>
                                <th class="p-4">คำแปล</th>
                                <th class="p-4">ตัวอย่างประโยค</th>
                            </tr>
                        </thead>
                        <tbody id="vocab-tbody" class="divide-y divide-slate-800/50">
                            <!-- Data populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Tab: Quiz Mode -->
        <section id="tab-quiz" class="hidden space-y-6">
            <div class="max-w-xl mx-auto glass p-8 rounded-3xl border border-slate-800 text-center space-y-6">
                <div class="flex justify-between items-center text-sm text-slate-400">
                    <button onclick="switchTab('vocab')" class="text-slate-400 hover:text-white">← กลับหน้าแดชบอร์ด</button>
                    <span id="quiz-progress">ข้อที่ 1/5</span>
                </div>

                <div id="quiz-card" class="space-y-4 py-6">
                    <span id="quiz-level" class="px-3 py-1 bg-red-950 text-red-400 border border-red-800 rounded-full text-xs font-semibold">HSK 1</span>
                    <h2 id="quiz-word" class="text-6xl font-bold text-white">爱</h2>
                    <p id="quiz-pinyin" class="text-xl text-amber-400 font-mono">ài</p>
                    <p id="quiz-type" class="text-xs text-slate-500">[v.]</p>
                </div>

                <div class="space-y-3">
                    <input type="text" id="quiz-input" placeholder="พิมพ์คำแปลภาษาไทย..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-lg focus:outline-none focus:border-red-500">
                    <button onclick="checkQuizAnswer()" class="w-full bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white py-3 rounded-xl font-bold transition">
                        ส่งคำตอบ
                    </button>
                </div>

                <div id="quiz-feedback" class="hidden p-4 rounded-xl text-sm font-medium"></div>
            </div>
        </section>

    </main>

    <script>
        let vocabData = [];
        let currentFilter = 'all';
        let quizPool = [];
        let currentQuizIndex = 0;
        let score = 0;

        // Fetch Data from data/hsk_vocab.json
        async function loadVocab() {
            try {
                const res = await fetch('data/hsk_vocab.json');
                vocabData = await res.json();
            } catch (e) {
                // Mock fallback data if JSON fails to load directly
                vocabData = [
                    { id: 1, hsk_level: 1, word: "爱", pinyin: "ài", type: "v.", meaning: "รัก", example: "妈妈，我爱你。" },
                    { id: 2, hsk_level: 1, word: "八", pinyin: "bā", type: "num.", meaning: "แปด", example: "他八岁了。" },
                    { id: 3, hsk_level: 2, word: "帮助", pinyin: "bāngzhù", type: "v.", meaning: "ช่วยเหลือ", example: "谢谢你的帮助。" },
                    { id: 4, hsk_level: 3, word: "阿姨", pinyin: "āyí", type: "n.", meaning: "น้า, ป้า", example: "阿姨好！" }
                ];
            }
            updateStats();
            renderVocabTable();
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = vocabData.length;
            document.getElementById('stat-hsk1').innerText = vocabData.filter(x => x.hsk_level === 1).length;
            document.getElementById('stat-hsk2').innerText = vocabData.filter(x => x.hsk_level === 2).length;
            document.getElementById('stat-hsk3').innerText = vocabData.filter(x => x.hsk_level === 3).length;
        }

        function renderVocabTable() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const tbody = document.getElementById('vocab-tbody');
            tbody.innerHTML = '';

            const filtered = vocabData.filter(item => {
                const matchLvl = currentFilter === 'all' || item.hsk_level === currentFilter;
                const matchKw = item.word.toLowerCase().includes(keyword) || 
                                item.pinyin.toLowerCase().includes(keyword) || 
                                item.meaning.toLowerCase().includes(keyword);
                return matchLvl && matchKw;
            });

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 transition';
                tr.innerHTML = `
                    <td class="p-4 font-mono font-semibold text-xs text-slate-400">HSK ${item.hsk_level}</td>
                    <td class="p-4 font-bold text-lg text-white">${item.word}</td>
                    <td class="p-4 text-amber-400 font-mono">${item.pinyin}</td>
                    <td class="p-4 text-xs text-slate-400">${item.type}</td>
                    <td class="p-4 font-medium text-emerald-400">${item.meaning}</td>
                    <td class="p-4 text-slate-400 text-xs italic">${item.example || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterLevel(level) {
            currentFilter = level;
            ['all', 1, 2, 3].forEach(l => {
                const btn = document.getElementById(`btn-lvl-${l}`);
                if (l === level) {
                    btn.className = 'px-4 py-2 rounded-xl text-sm font-medium bg-red-600 text-white';
                } else {
                    btn.className = 'px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-300';
                }
            });
            renderVocabTable();
        }

        function switchTab(tab) {
            if (tab === 'quiz') {
                document.getElementById('tab-vocab').classList.add('hidden');
                document.getElementById('tab-quiz').classList.remove('hidden');
                initQuiz();
            } else {
                document.getElementById('tab-quiz').classList.add('hidden');
                document.getElementById('tab-vocab').classList.remove('hidden');
            }
        }

        function initQuiz() {
            quizPool = [...vocabData].sort(() => 0.5 - Math.random()).slice(0, 5);
            currentQuizIndex = 0;
            score = 0;
            showQuizQuestion();
        }

        function showQuizQuestion() {
            if (currentQuizIndex >= quizPool.length) {
                document.getElementById('quiz-card').innerHTML = `
                    <h2 class="text-3xl font-bold text-emerald-400">🎉 ทำควิซเสร็จสิ้น!</h2>
                    <p class="text-lg text-slate-300">คุณได้คะแนน ${score} / ${quizPool.length}</p>
                `;
                document.getElementById('quiz-input').classList.add('hidden');
                return;
            }

            const q = quizPool[currentQuizIndex];
            document.getElementById('quiz-progress').innerText = `ข้อที่ ${currentQuizIndex + 1}/${quizPool.length}`;
            document.getElementById('quiz-level').innerText = `HSK ${q.hsk_level}`;
            document.getElementById('quiz-word').innerText = q.word;
            document.getElementById('quiz-pinyin').innerText = q.pinyin;
            document.getElementById('quiz-type').innerText = `[${q.type}]`;
            document.getElementById('quiz-input').value = '';
            document.getElementById('quiz-feedback').classList.add('hidden');
        }

        function checkQuizAnswer() {
            const ans = document.getElementById('quiz-input').value.trim();
            const q = quizPool[currentQuizIndex];
            const feedback = document.getElementById('quiz-feedback');
            
            feedback.classList.remove('hidden');
            if (ans && (q.meaning.includes(ans) || ans.includes(q.meaning))) {
                score++;
                feedback.className = 'p-4 rounded-xl text-sm font-medium bg-emerald-950 border border-emerald-800 text-emerald-300';
                feedback.innerText = '✨ ถูกต้อง!';
            } else {
                feedback.className = 'p-4 rounded-xl text-sm font-medium bg-red-950 border border-red-800 text-red-300';
                feedback.innerText = `❌ เฉลย: ${q.meaning} (${q.example})`;
            }

            setTimeout(() => {
                currentQuizIndex++;
                showQuizQuestion();
            }, 1800);
        }

        window.onload = loadVocab;
    </script>
</body>
</html>
