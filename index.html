<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK Vocabulary Dashboard</title>
  
  <style>
    body {
      font-family: 'Tahoma', sans-serif;
      padding: 20px;
      background-color: #f8fafc;
    }

    /* ปุ่มเปิด-ปิด พินอิน */
    .toggle-btn {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      background-color: #ffffff;
      border: 2px solid #3b82f6;
      color: #3b82f6;
      border-radius: 8px;
      margin-bottom: 20px;
      transition: all 0.2s;
    }
    .toggle-btn:hover {
      background-color: #3b82f6;
      color: #ffffff;
    }

    /* กล่องคำศัพท์ (ใช้ร่วมกันทั้งแดชบอร์ดและโซนเรียงคำ) */
    .word-box {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      margin: 4px;
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s ease, border-color 0.2s;
    }
    .word-box:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
    }

    /* ตัวพินอิน */
    .word-box .pinyin {
      font-size: 0.85rem;
      color: #2563eb;
      font-weight: 500;
      height: 18px; /* ล็อกความสูงไว้ ไม่ให้กล่องขยับเวลาซ่อนพินอิน */
    }

    /* ตัวอักษรจีน */
    .word-box .chinese {
      font-size: 1.4rem;
      font-weight: bold;
      color: #1e293b;
    }

    /* 🎯 จุดสำคัญ: เมื่อ body มีคลาส hide-pinyin จะซ่อนพินอินทุกจุดทันที */
    body.hide-pinyin .pinyin {
      visibility: hidden;
    }

    /* ตกแต่งโซนแสดงผล */
    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin: 15px 0 8px 0;
      color: #334155;
    }
    .container-zone {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 12px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      min-height: 60px;
    }
  </style>
</head>
<body>

  <!-- ปุ่มสลับ เปิด/ปิด พินอิน -->
  <button class="toggle-btn" id="pinyin-toggle-btn" onclick="togglePinyin()">
    👁️ พินอิน: เปิด
  </button>

  <!-- 1. แดชบอร์ดคำศัพท์รวม -->
  <div class="section-title">📚 แดชบอร์ดคำศัพท์ (กดที่กล่องเพื่อดูรายละเอียด)</div>
  <div id="vocab-dashboard" class="container-zone"></div>

  <!-- 2. กล่องคำศัพท์สำหรับเรียงประโยค -->
  <div class="section-title">🧩 กล่องคำศัพท์สำหรับเรียงประโยค</div>
  <div id="sentence-builder" class="container-zone"></div>

  <!-- ดึงข้อมูลคำศัพท์จาก data.js -->
  <script src="data.js"></script>

  <script>
    let isPinyinShow = true;

    // 1. ฟังก์ชันเปิด/ปิด พินอินทั้งหน้าเว็บ
    function togglePinyin() {
      isPinyinShow = !isPinyinShow;
      
      // สลับคลาส hide-pinyin ที่ body
      document.body.classList.toggle('hide-pinyin', !isPinyinShow);
      
      // เปลี่ยนข้อความบนปุ่ม
      const btn = document.getElementById('pinyin-toggle-btn');
      btn.innerText = isPinyinShow ? '👁️ พินอิน: เปิด' : '🙈 พินอิน: ปิด';
    }

    // 2. ฟังก์ชันสร้าง Element กล่องคำศัพท์ (มีพินอินติดไปทุกกล่อง)
    function createWordBox(wordObj, onClickHandler) {
      const box = document.createElement('div');
      box.className = 'word-box';
      
      box.innerHTML = `
        <span class="pinyin">${wordObj.pinyin || ''}</span>
        <span class="chinese">${wordObj.chinese}</span>
      `;

      if (onClickHandler) {
        box.onclick = () => onClickHandler(wordObj);
      }

      return box;
    }

    // 3. แสดงผลในแดชบอร์ดคำศัพท์
    function renderDashboard() {
      const container = document.getElementById('vocab-dashboard');
      container.innerHTML = '';

      // ดึงข้อมูลจากไฟล์ data.js (ถ้าไม่มีจะใช้ข้อมูลจำลอง)
      const list = (typeof words !== 'undefined') ? words : [
        { id: 451, chinese: "难过", pinyin: "nánguò", thai: "เสียใจ", sentence_zh: "听到这个消息我很难过。" },
        { id: 455, chinese: "努力", pinyin: "nǔlì", thai: "ขยัน", sentence_zh: "努力学习。" }
      ];

      list.forEach(item => {
        const card = createWordBox(item, (selected) => {
          // เมื่อกดที่กล่องในแดชบอร์ด จะแสดงรายละเอียด
          alert(`คำศัพท์: ${selected.chinese}\nพินอิน: ${selected.pinyin}\nคำแปล: ${selected.thai}\nประโยคตัวอย่าง: ${selected.sentence_zh}`);
        });
        container.appendChild(card);
      });
    }

    // 4. แสดงผลในโซนกล่องเรียงประโยค
    function renderSentenceGame() {
      const container = document.getElementById('sentence-builder');
      container.innerHTML = '';

      const gameWords = [
        { chinese: "我", pinyin: "wǒ" },
        { chinese: "很", pinyin: "hěn" },
        { chinese: "难过", pinyin: "nánguò" }
      ];

      gameWords.forEach(item => {
        const tile = createWordBox(item, (selected) => {
          console.log("เลือกคำว่า:", selected.chinese);
        });
        container.appendChild(tile);
      });
    }

    // เรียกให้ทำงานทันทีเมื่อเปิดหน้าเว็บ
    renderDashboard();
    renderSentenceGame();
  </script>

</body>
</html>
