<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1-3 Chinese Quiz Application</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --success: #10b981;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 800px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 24px; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 16px; margin-bottom: 20px; }
        .title { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
        .controls { display: flex; gap: 12px; align-items: center; }
        
        .toggle-switch { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
        .toggle-switch input { display: none; }
        .slider { width: 40px; height: 22px; background: #cbd5e1; border-radius: 20px; position: relative; transition: 0.3s; }
        .slider::before { content: ""; position: absolute; width: 16px; height: 16px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: 0.3s; }
        input:checked + .slider { background: var(--primary); }
        input:checked + .slider::before { transform: translateX(18px); }

        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #f1f5f9; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-card .val { font-size: 1.2rem; font-weight: bold; color: var(--primary); }
        .stat-card .lbl { font-size: 0.8rem; color: #64748b; }

        .mode-selector { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 20px; }
        .mode-btn { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s; }
        .mode-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .quiz-area { background: #fafafa; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; min-height: 280px; display: flex; flex-direction: column; justify-content: space-between; }
        .question-box { font-size: 1.5rem; text-align: center; margin-bottom: 15px; min-height: 60px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .pinyin { font-size: 1rem; color: #64748b; margin-bottom: 4px; display: block; }
        .hide-pinyin .pinyin { display: none !important; }

        .interactive-zone { margin: 15px 0; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .word-block { background: white; border: 2px solid #cbd5e1; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: 500; user-select: none; transition: 0.2s; }
        .word-block:hover { border-color: var(--primary); background: #eef2ff; }
        .word-block.selected { background: #c7d2fe; border-color: var(--primary); }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .opt-btn { background: white; border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; font-size: 1rem; cursor: pointer; text-align: center; transition: 0.2s; }
        .opt-btn:hover { background: #f1f5f9; }

        .text-input { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
        .text-input:focus { border-color: var(--primary); }

        .action-btn { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .action-btn:hover { background: var(--primary-hover); }

        .audio-btn { background: #e0e7ff; color: var(--primary); border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div class="container" id="app">
    <header>
        <div class="title">HSK 1-3 Quiz Master</div>
        <div class="controls">
            <label class="toggle-switch">
                <span>พินอิน</span>
                <input type="checkbox" id="pinyinToggle" checked onchange="togglePinyin()">
                <span class="slider"></span>
            </label>
        </div>
    </header>

    <div class="dashboard">
        <div class="stat-card"><div class="val" id="levelDisplay">1 / 20</div><div class="lbl">ด่าน (Level)</div></div>
        <div class="stat-card"><div class="val" id="progressDisplay">1 / 10</div><div class="lbl">ข้อที่</div></div>
        <div class="stat-card"><div class="val" id="scoreDisplay">0</div><div class="lbl">คะแนน</div></div>
        <div class="stat-card"><div class="val" id="timerDisplay">--</div><div class="lbl">เวลาเหลือ</div></div>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="switchMode(1)">1. เรียงคำ</button>
        <button class="mode-btn" onclick="switchMode(2)">2. ลากคำแปล</button>
        <button class="mode-btn" onclick="switchMode(3)">3. เติมประโยค</button>
        <button class="mode-btn" onclick="switchMode(4)">4. ฟังเสียง</button>
        <button class="mode-btn" onclick="switchMode(5)">5. สุ่มโหมด</button>
    </div>

    <div class="quiz-area" id="quizArea">
        <div class="question-box" id="questionBox"></div>
        <div id="interactiveArea"></div>
        <button class="action-btn" id="submitBtn" onclick="checkAnswer()">ตรวจคำตอบ</button>
    </div>
</div>

<div class="modal" id="resultModal">
    <div class="modal-content">
        <h2>🎉 จบด่านที่ <span id="completedLevel">1</span></h2>
        <p style="margin: 15px 0; font-size: 1.1rem;">คะแนนของคุณ: <strong id="finalScore">0</strong> / 10</p>
        <button class="action-btn" onclick="nextLevel()">ไปต่อด่านถัดไป</button>
        <button class="action-btn" style="background: #64748b; margin-top: 8px;" onclick="resetQuiz()">เริ่มใหม่ทั้งหมด</button>
    </div>
</div>

<script>
// คลังข้อมูลคำศัพท์ HSK 1-3 (ตัวอย่างโครงสร้างข้อมูลพร้อมขยายเพิ่ม)
const hskDatabase = [
    { id: 1, hsk: 1, chinese: "爱", pinyin: "ài", thai: "รัก", sentence_zh: "我爱吃米饭。", sentence_py: "wǒ ài chī mǐfàn.", sentence_th: "ฉันรักการกินข้าวสวย", missing: "รัก" },
    { id: 2, hsk: 1, chinese: "吃", pinyin: "chī", thai: "กิน", sentence_zh: "你不吃吗？", sentence_py: "nǐ bù chī ma?", sentence_th: "คุณไม่กินเหรอ", missing: "กิน" },
    { id: 3, hsk: 1, chinese: "米饭", pinyin: "mǐfàn", thai: "ข้าวสวย", sentence_zh: "我不喜欢吃米饭。", sentence_py: "wǒ bù xǐhuān chī mǐfàn.", sentence_th: "ฉันไม่ชอบกินข้าวสวย", missing: "ข้าวสวย" },
    { id: 4, hsk: 1, chinese: "苹果", pinyin: "píngguǒ", thai: "แอปเปิ้ล", sentence_zh: "我想买苹果。", sentence_py: "wǒ xiǎng mǎi píngguǒ.", sentence_th: "ฉันอยากซื้อแอปเปิ้ล", missing: "แอปเปิ้ล" },
    { id: 5, hsk: 1, chinese: "喝", pinyin: "hē", thai: "ดื่ม", sentence_zh: "你想喝什么？", sentence_py: "nǐ xiǎng hē shénme?", sentence_th: "คุณอยากดื่มอะไร", missing: "ดื่ม" },
    { id: 6, hsk: 2, chinese: "帮助", pinyin: "bāngzhù", thai: "ช่วยเหลือ", sentence_zh: "谢谢你的帮助。", sentence_py: "xièxie nǐ de bāngzhù.", sentence_th: "ขอบคุณสำหรับการช่วยเหลือของคุณ", missing: "ช่วยเหลือ" },
    { id: 7, hsk: 2, chinese: "准备", pinyin: "zhǔnbèi", thai: "เตรียมตัว", sentence_zh: "我在为考试做准备。", sentence_py: "wǒ zài wèi kǎoshì zuò zhǔnbèi.", sentence_th: "ฉันกำลังเตรียมตัวเพื่อการสอบ", missing: "เตรียมตัว" },
    { id: 8, hsk: 2, chinese: "身体", pinyin: "shēntǐ", thai: "ร่างกาย", sentence_zh: "祝你身体健康。", sentence_py: "zhù nǐ shēntǐ jiànkāng.", sentence_th: "ขอให้ร่างกายของคุณแข็งแรง", missing: "ร่างกาย" },
    { id: 9, hsk: 3, chinese: "照顾", pinyin: "zhàogù", thai: "ดูแล", sentence_zh: "我会照顾好自己。", sentence_py: "wǒ huì zhàogù hǎo zìjǐ.", sentence_th: "ฉันจะดูแลตัวเองให้ดี", missing: "ดูแล" },
    { id: 10, hsk: 3, chinese: "解决", pinyin: "jiějué", thai: "แก้ไข", sentence_zh: " هذا 这个问题怎么解决？", sentence_py: "zhège wèntí zěnme jiějué?", sentence_th: "ปัญหานี้จะแก้ไขอย่างไร", missing: "แก้ไข" }
];

let currentLevel = 1;
let currentQuestionIdx = 0;
let score = 0;
let currentMode = 1;
let activeQuestionMode = 1;
let levelQuestions = [];
let userSelection = [];
let timer = null;
let timeLeft = 30;

function initQuiz() {
    loadLevelQuestions();
    renderQuestion();
}

function loadLevelQuestions() {
    // สุ่มคำถาม 10 ข้อสำหรับด่าน
    levelQuestions = [...hskDatabase].sort(() => 0.5 - Math.random()).slice(0, 10);
}

function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === mode);
    });
    renderQuestion();
}

function togglePinyin() {
    const isChecked = document.getElementById('pinyinToggle').checked;
    const quizArea = document.getElementById('quizArea');
    quizArea.classList.toggle('hide-pinyin', !isChecked);
}

function renderQuestion() {
    clearInterval(timer);
    userSelection = [];
    const q = levelQuestions[currentQuestionIdx];
    const qBox = document.getElementById('questionBox');
    const interactive = document.getElementById('interactiveArea');
    
    activeQuestionMode = currentMode === 5 ? Math.floor(Math.random() * 4) + 1 : currentMode;

    document.getElementById('levelDisplay').innerText = `${currentLevel} / 20`;
    document.getElementById('progressDisplay').innerText = `${currentQuestionIdx + 1} / 10`;
    document.getElementById('scoreDisplay').innerText = score;
    
    qBox.innerHTML = '';
    interactive.innerHTML = '';

    startTimer();

    if (activeQuestionMode === 1) {
        // โหมด 1: เรียงคำ
        qBox.innerHTML = `<span class="pinyin">${q.pinyin}</span><div>${q.chinese}</div>`;
        const words = q.sentence_zh.split('');
        const shuffled = [...words].sort(() => 0.5 - Math.random());
        
        const targetZone = document.createElement('div');
        targetZone.id = "targetBlocks";
        targetZone.className = "interactive-zone";
        targetZone.style.minHeight = "50px";
        targetZone.style.borderBottom = "2px dashed #cbd5e1";

        const sourceZone = document.createElement('div');
        sourceZone.className = "interactive-zone";

        shuffled.forEach((char, i) => {
            const btn = document.createElement('div');
            btn.className = "word-block";
            btn.innerText = char;
            btn.onclick = () => {
                if (btn.parentElement === sourceZone) {
                    targetZone.appendChild(btn);
                } else {
                    sourceZone.appendChild(btn);
                }
            };
            sourceZone.appendChild(btn);
        });

        interactive.appendChild(targetZone);
        interactive.appendChild(sourceZone);

    } else if (activeQuestionMode === 2) {
        // โหมด 2: ลาก/เลือกคำแปลภาษาไทย
        qBox.innerHTML = `<span class="pinyin">${q.pinyin}</span><div>${q.chinese}</div>`;
        const grid = document.createElement('div');
        grid.className = "options-grid";
        
        const options = getRandomOptions(q.thai, 'thai');
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "opt-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.opt-btn').forEach(b => b.style.background = 'white');
                btn.style.background = '#c7d2fe';
                userSelection = [opt];
            };
            grid.appendChild(btn);
        });
        interactive.appendChild(grid);

    } else if (activeQuestionMode === 3) {
        // โหมด 3: เติมคำในประโยค
        const maskedSentence = q.sentence_th.replace(q.missing, "______");
        qBox.innerHTML = `<span class="pinyin">${q.sentence_py}</span><div>${q.sentence_zh}</div><div style="font-size:1.1rem; color:#475569; margin-top:8px;">${maskedSentence}</div>`;
        
        const input = document.createElement('input');
        input.type = "text";
        input.className = "text-input";
        input.placeholder = "พิมพ์คำแปลภาษาไทยที่เว้นว่างไว้...";
        input.id = "textAnswer";
        interactive.appendChild(input);

    } else if (activeQuestionMode === 4) {
        // โหมด 4: ฟังเสียงแล้วเลือกคำแปล
        qBox.innerHTML = `<button class="audio-btn" onclick="playAudio('${q.chinese}')">🔊</button><div>กดเพื่อฟังเสียงภาษาจีน</div>`;
        playAudio(q.chinese);

        const grid = document.createElement('div');
        grid.className = "options-grid";
        
        const options = getRandomOptions(q.thai, 'thai');
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = "opt-btn";
            btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.opt-btn').forEach(b => b.style.background = 'white');
                btn.style.background = '#c7d2fe';
                userSelection = [opt];
            };
            grid.appendChild(btn);
        });
        interactive.appendChild(grid);
    }
}

function playAudio(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = 0.8;
    window.speechSynthesis.speak(utterance);
}

function getRandomOptions(correctAnswer, key) {
    const opts = [correctAnswer];
    while (opts.length < 4) {
        const randomItem = hskDatabase[Math.floor(Math.random() * hskDatabase.length)][key];
        if (!opts.includes(randomItem)) opts.push(randomItem);
    }
    return opts.sort(() => 0.5 - Math.random());
}

function startTimer() {
    timeLeft = 30;
    document.getElementById('timerDisplay').innerText = `${timeLeft}s`;
    timer = setInterval(() => {
        timeLeft--;
        document.getElementById('timerDisplay').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
            clearInterval(timer);
            checkAnswer(true);
        }
    }, 1000);
}

function checkAnswer(timeout = false) {
    clearInterval(timer);
    const q = levelQuestions[currentQuestionIdx];
    let isCorrect = false;

    if (!timeout) {
        if (activeQuestionMode === 1) {
            const targetBlocks = document.getElementById('targetBlocks');
            const constructed = Array.from(targetBlocks.children).map(el => el.innerText).join('');
            isCorrect = (constructed === q.sentence_zh);
        } else if (activeQuestionMode === 2 || activeQuestionMode === 4) {
            isCorrect = (userSelection[0] === q.thai);
        } else if (activeQuestionMode === 3) {
            const val = document.getElementById('textAnswer').value.trim();
            isCorrect = (val === q.missing);
        }
    }

    if (isCorrect) {
        score++;
        alert("Correct!  ถูกต้อง");
    } else {
        alert(`Incorrect!  คำตอบที่ถูกต้องคือ: ${activeQuestionMode === 1 ? q.sentence_zh : (activeQuestionMode === 3 ? q.missing : q.thai)}`);
    }

    currentQuestionIdx++;
    if (currentQuestionIdx < 10) {
        renderQuestion();
    } else {
        showLevelResult();
    }
}

function showLevelResult() {
    document.getElementById('completedLevel').innerText = currentLevel;
    document.getElementById('finalScore').innerText = score;
    document.getElementById('resultModal').style.display = 'flex';
}

function nextLevel() {
    currentLevel++;
    currentQuestionIdx = 0;
    score = 0;
    document.getElementById('resultModal').style.display = 'none';
    initQuiz();
}

function resetQuiz() {
    currentLevel = 1;
    currentQuestionIdx = 0;
    score = 0;
    document.getElementById('resultModal').style.display = 'none';
    initQuiz();
}

// เริ่มต้นระบบเมื่อโหลดหน้า
window.onload = initQuiz;
</script>
</body>
</html>
